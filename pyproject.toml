[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital"
dynamic = ["version"]
description = "Physics-based orbital mechanics simulator: two-body propagation with quantitative numerical validation."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "Harshith Vaibhav" }]
dependencies = [
    "numpy>=1.26",
]
classifiers = [
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "matplotlib>=3.11.2",
    "mpmath==1.3.0",  # scripts/reference_mp.py only (requirements-0.1.1 §4); never imported by orbital
]

[tool.setuptools.dynamic]
version = { attr = "orbital.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
