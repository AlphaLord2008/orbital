# Cloudflare Workers Static Assets deploys (ADR-0006 rev 2).
# - Pull request from this repository: upload a new Worker version (not live) and post its
#   Version URL https://pr-<n>-orbital-web.<subdomain>.workers.dev, then check its headers
#   and run Lighthouse against it.
# - Push to main: deploy to the temporary production domain https://orbital-web.<subdomain>.workers.dev
# - Manual run, action "deploy": deploy the chosen ref to production (also creates the Worker
#   the first time; `versions upload` cannot create it).
# - Manual run, action "rollback" with a version ID: roll production back to that version.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Without them every
# job is skipped with a notice, so CI stays green before the Cloudflare account exists.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy = deploy this ref to production; rollback = roll production back to version_id'
        type: choice
        options: [deploy, rollback]
        default: deploy
      version_id:
        description: 'For rollback: Worker version ID (Cloudflare dashboard: Workers, orbital-web, Deployments)'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.165.0
  WRANGLER_SEND_METRICS: 'false'
  # These logs are public. Every wrangler call is piped through web/scripts/redact-log.sh,
  # which replaces e-mail addresses, and account-listing commands are banned by
  # scripts/check-workflow-privacy.sh in CI (incident 2026-11-25, docs/deploy.md).
  # Temporary production domain (ADR-0006 rev 2); public, not a secret.
  PROD_URL: https://orbital-web.harshuvaibhav.workers.dev

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Deploy preview' || (inputs.action == 'rollback' && 'Rollback production' || 'Deploy production') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check Cloudflare credentials
        id: creds
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (see docs/deploy.md)."
          fi

      - if: steps.creds.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.creds.outputs.ok == 'true' && inputs.action == 'rollback'
        name: Roll back production
        working-directory: .
        env:
          VERSION_ID: ${{ inputs.version_id }}
        run: |
          [[ "$VERSION_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::version_id must be a Worker version UUID"; exit 1; }
          npx --yes "wrangler@${WRANGLER_VERSION}" rollback "$VERSION_ID" \
            --name orbital-web --message "Rollback via GitHub Actions" 2>&1 | ./web/scripts/redact-log.sh
          # Not `deployments list`: its output includes the account e-mail, and these logs are public.
          sleep 10
          echo "Production now serves: $(curl -sSf "$PROD_URL/" | grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)"

      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        run: pnpm install --frozen-lockfile && pnpm build

      - if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        name: Upload preview version
        id: preview
        working-directory: web/apps/web
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" 2>&1 | ../../scripts/redact-log.sh | tee upload.log
          url=$(grep -Eo "https://pr-${{ github.event.pull_request.number }}-orbital-web\.[a-z0-9-]+\.workers\.dev" upload.log | head -1)
          [ -n "$url" ] || url=$(grep -Eo 'https://[a-z0-9-]+-orbital-web\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          [ -n "$url" ] || { echo "::error::No Version URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ok == 'true' && github.event_name != 'pull_request' && inputs.action != 'rollback'
        name: Deploy production
        id: prod
        working-directory: web/apps/web
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --message "${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" 2>&1 | ../../scripts/redact-log.sh | tee deploy.log
          url=$(grep -Eo 'https://orbital-web\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::No workers.dev URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        name: Check deployed headers
        env:
          URL: ${{ steps.preview.outputs.url || steps.prod.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do curl -sSfI "$URL/" > headers.txt && break; sleep 5; done
          cat headers.txt
          grep -qi "^content-security-policy: default-src 'self'; script-src 'self';" headers.txt
          ! grep -qi 'unsafe-inline' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^cross-origin-opener-policy: same-origin' headers.txt
          asset=$(curl -sSf "$URL/" | grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          curl -sSfI "$URL$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          echo "Headers OK on $URL"

      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        name: E2E smoke against the deployed version (CSP violations, headers, axe)
        working-directory: web/apps/web
        env:
          ORBITAL_BASE_URL: ${{ steps.preview.outputs.url || steps.prod.outputs.url }}
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --project=chromium

      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        name: Lighthouse on the deployed version
        working-directory: web/apps/web
        env:
          URL: ${{ steps.preview.outputs.url || steps.prod.outputs.url }}
        run: |
          pnpm exec lhci autorun --config=lighthouserc.preview.json --collect.url="$URL/"
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".lighthouseci-preview").filter((f) => /\.report\.json$/.test(f) || /^lhr-.*\.json$/.test(f));
            const rows = files.map((f) => {
              const r = JSON.parse(fs.readFileSync(".lighthouseci-preview/" + f, "utf8"));
              const c = r.categories, a = r.audits;
              const s = (k) => Math.round(c[k].score * 100);
              return `| ${s("performance")} | ${s("accessibility")} | ${s("best-practices")} | ${s("seo")} | ${Math.round(a["largest-contentful-paint"].numericValue)} ms | ${a["cumulative-layout-shift"].numericValue} | ${Math.round(a["total-blocking-time"].numericValue)} ms |`;
            });
            const out = ["### Lighthouse: " + process.env.URL, "| Perf | A11y | Best practices | SEO | LCP | CLS | TBT |", "|---|---|---|---|---|---|---|", ...new Set(rows)].join("\n");
            console.log(out);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '

      - if: always() && steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-deployed
          path: web/apps/web/.lighthouseci-preview
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        name: Comment the preview URL
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          body="Preview for ${GITHUB_SHA::7}: $URL (Worker version, not live). Headers checked; Lighthouse report in the run artifacts."
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" > /dev/null
