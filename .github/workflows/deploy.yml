# Cloudflare Workers Static Assets deploys (ADR-0006 rev 2).
# - Pull request from this repository: upload a new Worker version (not live) and post its
#   Version URL https://pr-<n>-orbital-web.<subdomain>.workers.dev, then check its headers
#   and run Lighthouse against it.
# - Push to main: deploy to the temporary production domain https://orbital-web.<subdomain>.workers.dev
# - Manual run, action "deploy": deploy the chosen ref to production (also creates the Worker
#   the first time; `versions upload` cannot create it).
# - Manual run, action "rollback" with a version ID: roll production back to that version.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Without them every
# job is skipped with a notice, so CI stays green before the Cloudflare account exists.
name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy = deploy this ref to production; rollback = roll production back to version_id'
        type: choice
        options: [deploy, rollback]
        default: deploy
      version_id:
        description: 'For rollback: Worker version ID (wrangler versions list)'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: 4.165.0

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'Deploy preview' || (inputs.action == 'rollback' && 'Rollback production' || 'Deploy production') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check Cloudflare credentials
        id: creds
        working-directory: .
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set (see docs/deploy.md)."
          fi

      - if: steps.creds.outputs.ok == 'true' && inputs.action == 'rollback'
        name: Roll back production
        working-directory: .
        run: |
          [ -n "${{ inputs.version_id }}" ] || { echo "::error::version_id is required for rollback"; exit 1; }
          npx --yes "wrangler@${WRANGLER_VERSION}" rollback "${{ inputs.version_id }}" \
            --name orbital-web --message "Rollback via GitHub Actions by ${{ github.actor }}"

      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        run: pnpm install --frozen-lockfile && pnpm build

      - if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        name: Upload preview version
        id: preview
        working-directory: web/apps/web
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" versions upload \
            --preview-alias "pr-${{ github.event.pull_request.number }}" \
            --message "PR #${{ github.event.pull_request.number }} @ ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -Eo "https://pr-${{ github.event.pull_request.number }}-orbital-web\.[a-z0-9-]+\.workers\.dev" upload.log | head -1)
          [ -n "$url" ] || url=$(grep -Eo 'https://[a-z0-9-]+-orbital-web\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)
          [ -n "$url" ] || { echo "::error::No Version URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ok == 'true' && github.event_name != 'pull_request' && inputs.action != 'rollback'
        name: Deploy production
        id: prod
        working-directory: web/apps/web
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --message "${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" | tee deploy.log
          url=$(grep -Eo 'https://orbital-web\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::No workers.dev URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        name: Check deployed headers
        env:
          URL: ${{ steps.preview.outputs.url || steps.prod.outputs.url }}
        run: |
          for i in 1 2 3 4 5 6; do curl -sSfI "$URL/" > headers.txt && break; sleep 5; done
          cat headers.txt
          grep -qi "^content-security-policy: default-src 'self'; script-src 'self';" headers.txt
          ! grep -qi 'unsafe-inline' headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          grep -qi '^cross-origin-opener-policy: same-origin' headers.txt
          asset=$(curl -sSf "$URL/" | grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          curl -sSfI "$URL$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          echo "Headers OK on $URL"

      - if: steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        name: Lighthouse on the deployed version
        working-directory: web/apps/web
        env:
          URL: ${{ steps.preview.outputs.url || steps.prod.outputs.url }}
        run: pnpm exec lhci autorun --config=lighthouserc.preview.json --collect.url="$URL/"

      - if: always() && steps.creds.outputs.ok == 'true' && inputs.action != 'rollback'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-deployed
          path: web/apps/web/.lighthouseci-preview
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        name: Comment the preview URL
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          body="Preview for ${GITHUB_SHA::7}: $URL (Worker version, not live). Headers checked; Lighthouse report in the run artifacts."
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" > /dev/null
