# ORBITAL CI (WA-1, WA-2). Every pull request and every push to main runs all of it.
# Action versions are pinned to full commit SHAs; Dependabot proposes updates.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} (v0.1 suite)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      # Rerun of the registered v0.1.1 cases (requirements-0.1.1). Writes nothing; any FAIL fails CI.
      - run: python scripts/validation/run_v0_1_1.py --check

  fixtures:
    name: Fixtures fresh (mpmath reference + conformance C1-C8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      # The TS engine is tested against these files, so they must be exactly what the
      # authoritative Python engine and the independent reference produce today.
      - run: python scripts/reference_mp.py
      - run: python scripts/generate_fixtures.py
      - run: git diff --exit-code -- fixtures/ && test -z "$(git status --porcelain -- fixtures/)"

  preregistration:
    name: Pre-registration integrity (requirements-0.1.1 frozen)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Hash posted 2026-11-23 23:38 EST, before any registered run. Any edit fails CI.
      - run: echo "908a3366aced77ea835264452a4bc5c87dc050b0958eeb31ccb7e5a385db9165  docs/requirements-0.1.1.md" | sha256sum --check --strict

  workflow-privacy:
    name: Deploy log privacy guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: web/scripts/check-workflow-privacy.sh

  web:
    name: Web (format, lint, typecheck, unit, boundary, build, size)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm mutation
      - run: pnpm check:boundary
      - run: pnpm build
      - run: pnpm size
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/apps/web/dist
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: E2E smoke (${{ matrix.browser }})
    needs: web
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/apps/web/dist
      - run: pnpm --filter @orbital/web exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @orbital/web exec playwright test --project=${{ matrix.browser }}
      # Engine conformance C1-C8, REF-1 and TS-V0..TS-P2 in this browser (ADR-0003 §3.3).
      - run: pnpm exec vitest run --project browser --browser=${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}-results
          path: web/apps/web/test-results
          retention-days: 7

  lighthouse:
    name: Lighthouse (local build, production headers)
    needs: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/apps/web/dist
      - run: pnpm --filter @orbital/web run lhci
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-local
          path: web/apps/web/.lighthouseci
          include-hidden-files: true
          retention-days: 14
